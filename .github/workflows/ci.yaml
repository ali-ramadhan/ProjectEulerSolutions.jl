name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Run Tests - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.12'
          - '1.13'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      - uses: julia-actions/julia-runtest@v1

  threads:
    name: Run Threaded Tests - Julia ${{ matrix.version }} - 4 threads
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.12'
          - '1.13'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      # The solutions that use threads take a serial path when Julia has a single thread, as it does in the
      # test job above, so their threaded code is only exercised here.
      - name: Run the tests of the solutions that use threads
        run: julia --threads=4 --project=. test/runtests_threaded.jl

  hacker_rank:
    name: Run HackerRank Scripts - Julia 1.2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # HackerRank runs submissions on Julia 1.2.0 (https://support.hackerrank.com/articles/6693750503-execution-environment),
      # so the scripts are run with that version. The package itself needs Julia 1.10+, so the test harness runs on a
      # current Julia, which is set up last so that it is the `julia` on PATH.
      - uses: julia-actions/setup-julia@v3
        id: hackerrank-julia
        with:
          version: '1.2'
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run HackerRank scripts on Julia 1.2
        run: julia --project=. test/hacker_rank/test_hacker_rank.jl
        env:
          HACKERRANK_JULIA: ${{ steps.hackerrank-julia.outputs.julia-bindir }}/julia

  aqua:
    name: Aqua
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      # Aqua is a test-only dependency, so the checks run through `Pkg.test` (see test/runtests.jl)
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: aqua
